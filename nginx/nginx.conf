events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 60M;

    # Upstream backend cluster (Load Balancer between 2+ API servers)
    upstream backend_cluster {
        # Round-robin by default
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
    }

    # HTTP Server (Port 80)
    server {
        listen 80;
        server_name localhost;

        # Optional: Redirect to HTTPS if SSL is enabled
        # return 301 https://$host$request_uri;

        # Add header to show which backend server handled the request (for demonstration)
        add_header X-Handled-By $upstream_addr always;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket & SSE streaming support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }
    }

    # HTTPS Server (Port 443 - Bonus requirement)
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Handled-By $upstream_addr always;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
